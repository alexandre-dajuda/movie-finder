<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Finder | Alexandre D'Ajuda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>🎬 Movie Finder</h1>
            <p>Search for any movie using OMDb API</p>
        </header>

        <div class="search-box">
            <input type="text" id="movie-input" placeholder="Type a movie title (e.g. Inception)...">
            <button id="search-btn">Search</button>
        </div>

        <div id="result-container">
            <p class="welcome-msg">Your movie results will appear here!</p>
        </div>
    </div>

    <footer class="main-footer">
    <p>&copy; 2026 | Built by <span>Alexandre D'Ajuda</span></p>
    <div class="footer-links">
        <a href="https://github.com/alexandre-dajuda" target="_blank">GitHub</a>
        <a href="#">Portfolio</a>
    </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
