<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFinder | Portfolio Project</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1>🎬 MovieFinder</h1>
            <p>Explore the world of cinema and save your favorites</p>
        </header>

        <div class="search-box">
            <input type="text" id="movie-input" placeholder="Enter movie title (ex: Batman)...">
            <button id="search-btn">Search</button>
        </div>

        <div id="result-container">
            </div>

        <section class="favorites-section">
            <h3>⭐ My Favorites</h3>
            <div id="favorites-list" class="fav-grid">
                </div>
        </section>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 | Built with JS Modules by <span>Alexandre D'Ajuda</span></p>
        <div class="footer-links">
            <a href="https://github.com/alexandre-dajuda" target="_blank">GitHub</a>
            <a href="#">Portfolio</a>
        </div>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
